<body class="calc12">
  <a href="../index.html">トップへ戻る</a>
  <p>
    MKWorld 24p集計機 - 12v12
  </p>
  <details>
    <summary>使い方（クリックで表示）</summary>
    <ol>
      <li>対戦チームのメンバーを1行ずつ記入して「<b>名前一括貼付</b>」を押す</li>
      <li>得点を入力(Enterキーで移動可)して「<b>計算</b>」を押す<br>
        ※回線落ち者の加点は「+」コース重複などの減点は「-」を含んだ式で表記
      </li>
      <li>結果画像URLを入力する（回線落ちが発生した場合は改行して複数入力する）</li>
      <li>「<b>集計結果をコピー</b>」を押して試合結果に貼りつけ</li>
    </ol>
  </details>
  <p>
    <tr class="setting">
      <td>
        <!-- 形式 -->
        <input id="membernum" class="number" size="3" type="hidden" value="12" readonly>
      </td>
      <td><input id="playernum" class="number" size="3" type="hidden" value="2" readonly></td>
      <td><input id="passernum" class="number" size="3" type="hidden" value="1" readonly></td>
    </tr>
  </p>
  <p>
    <textarea id="names" cols="100" rows="13" placeholder="ここにメンバー一覧をコピペ"></textarea>
    <!-- <textarea id="points" cols="10" rows="5" placeholder=""></textarea> -->
    <br>
    <button type="button" onclick="pasteNames()">名前一括貼付</button>
    <!-- <button type="button" onclick="pastePoints()">得点一括貼付</button> -->
  </p>
